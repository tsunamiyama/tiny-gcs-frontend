@let busy = pending() !== null;

<div class="flex flex-col bg-card border border-divider p-4 gap-2 h-full w-full">
    <span class="font-plex font-semibold text-[0.625em] text-strong-label tracking-[0.16em]">COMMANDS</span>
    <div class="flex gap-2 h-fit w-full">
        <button 
            type="button" 
            [disabled]="busy" 
            (click)="arm()" 
            class="flex-1 cursor-pointer font-plex font-medium text-xs text-primary border border-primary p-3.5 disabled:opacity-50 disabled:cursor-not-allowed">
            ARM
        </button>
        <button 
            type="button" 
            [disabled]="busy" 
            (click)="takeoff()" 
            class="flex-1 cursor-pointer font-plex font-medium text-xs text-primary border border-primary p-3.5 disabled:opacity-50 disabled:cursor-not-allowed">
            TAKEOFF
        </button>
        <button 
            type="button" 
            [disabled]="busy" 
            (click)="land()" 
            class="flex-1 cursor-pointer font-plex font-medium text-xs text-primary border border-primary p-3.5 disabled:opacity-50 disabled:cursor-not-allowed">
            LAND
        </button>
        <button 
            type="button" 
            [disabled]="busy" 
            (click)="returnToLaunch()" 
            class="flex-1 cursor-pointer font-plex font-medium text-xs text-primary border border-primary p-3.5 disabled:opacity-50 disabled:cursor-not-allowed">
            RETURN TO LAUNCH
        </button>
    </div>
</div>
