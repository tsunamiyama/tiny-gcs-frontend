@let ts = timestamp();

<div class="flex flex-col bg-inset border border-dashed border-divider p-4 gap-2 h-fit w-full">
    <span class="font-plex font-semibold text-[0.625em] text-strong-label tracking-[0.16em]">LINK</span>
    <div class="flex justify-between align-middle h-fit w-full">
        <span class="font-plex font-normal text-xs text-caption">Last Timestamp</span>
        <span class="font-plex-mono font-normal text-primary text-xs">{{ ts ? (ts * 1000 | date: 'HH:mm:ss.SSS') : '—' }}</span>
    </div>
    <div class="flex justify-between align-middle h-fit w-full">
        <span class="font-plex font-normal text-xs text-caption">Update Rate</span>
        <span class="font-plex-mono font-normal text-primary text-xs">10 Hz</span>
    </div>
    <div class="flex justify-between align-middle h-fit w-full">
        <span class="font-plex font-normal text-xs text-caption">Source</span>
        <span class="font-plex-mono font-normal text-primary text-xs">PX4 SITL</span>
    </div>
</div>
